<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page non trouvée — URHC Église Évangélique Union Renaissance d’Hommes en Christ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, #14223B 0%, #0A111F 100%);
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--gold-champagne);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: var(--white);
      margin-bottom: 1rem;
    }
    .error-text {
      color: var(--gray-soft);
      max-width: 520px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="error-hero">
    <div class="brand-logo-badge" style="margin-bottom: 2rem;">
      <img src="assets/images/logo-urhc.jpg" alt="Logo de l’Église URHC" class="brand-logo-img" width="56" height="51">
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page introuvable</h1>
    <p class="error-text">
      La page que vous recherchez n'est pas disponible ou a été déplacée. Notre site officiel est actuellement en conception.
    </p>
    <a href="index.html" class="btn btn-primary">
      <span>Retour à la page d'accueil</span>
    </a>
  </div>
</body>
</html>
